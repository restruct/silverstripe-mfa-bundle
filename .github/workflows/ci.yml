name: CI

on:
  push:
    # The repository's actual default branch (checked with the GitHub API, 2026-09-24).
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range; this matrix must follow it.
          - silverstripe: '5'
            php: '8.1'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_ci
      SS_ENVIRONMENT_TYPE: dev
      # silverstripe/totp-authenticator reports itself unconfigured without a key.
      SS_MFA_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Check out the module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # bcmath, gmp, sodium and openssl are required or recommended by the WebAuthn and
          # OTP libraries the bundled authenticators pull in.
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session, bcmath, gmp, sodium, openssl
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. The host
        # composer.json is written by hand, requiring recipe-cms; there is no skeleton to create
        # from.
        #
        # The module is required through a PATH repository pointing at the checkout, and
        # symlinked rather than mirrored ON PURPOSE - `/tests` is `export-ignore` in
        # .gitattributes, so a dist or mirrored install contains no tests at all.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-mfa-bundle": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\MFABundle\\\\Tests\\\\": "vendor/restruct/silverstripe-mfa-bundle/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Silverstripe 5 is in security-fixes-only until its April 2027 EOL, and every
          # release of it is covered by advisory PKSA-pjvm-vnw2-n3m2 (range <6.2.1), which will
          # not be patched there. Composer therefore refuses to install it under the default
          # policy. Blocking is disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg. -->
          <!-- failOnEmptyTestSuite: a suite that silently finds no tests must fail, not pass. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true" failOnEmptyTestSuite="true">
              <testsuites>
                  <testsuite name="mfa-bundle">
                      <directory>vendor/restruct/silverstripe-mfa-bundle/tests</directory>
                      <exclude>vendor/restruct/silverstripe-mfa-bundle/tests/browser</exclude>
                  </testsuite>
                  <testsuite name="consumer">
                      <directory>app/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Add a consumer-shape database test
        # A module's own suite cannot see a fixture in its tests/ dir that breaks the temp-database
        # build of a CONSUMING project (its fixtures are loaded by PHPUnit, not registered in the
        # class manifest). This test runs from the host, where they are.
        run: |
          mkdir -p app-host/app/tests
          cat > app-host/app/tests/ConsumerDbTest.php <<'PHP'
          <?php

          use SilverStripe\Dev\SapphireTest;
          use SilverStripe\Security\Member;

          class ConsumerDbTest extends SapphireTest
          {
              protected $usesDatabase = true;

              public function testTempDatabaseBuilds()
              {
                  $m = Member::create(['FirstName' => 'x']);
                  $m->write();
                  $this->assertGreaterThan(0, $m->ID);
              }
          }
          PHP

      - name: Run tests
        working-directory: app-host
        env:
          # Flushing the test manifest differs per leg:
          # - SS6 (PHPUnit 11) does NOT ignore a bare `flush=1` argument: it treats it as a test
          #   path. SS_PHPUNIT_FLUSH flushes instead.
          # - SS5 (framework 5) does not read SS_PHPUNIT_FLUSH at all, and `flush=1` cannot be
          #   combined with --testsuite. The SS5 legs therefore run each suite by PATH with a
          #   trailing flush=1.
          # --fail-on-empty-test-suite (PHPUnit 9.6 and 11) makes a run that finds no tests fail,
          # so a wrong path or a broken autoload cannot pass as green.
          SS_PHPUNIT_FLUSH: 1
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/phpunit --fail-on-empty-test-suite vendor/restruct/silverstripe-mfa-bundle/tests flush=1
            vendor/bin/phpunit --fail-on-empty-test-suite app/tests flush=1
          else
            vendor/bin/phpunit --fail-on-empty-test-suite --testsuite mfa-bundle
            vendor/bin/phpunit --fail-on-empty-test-suite --testsuite consumer
          fi

      - name: Boot the app and build the database
        # The suite proves the classes behave; this proves the module does not break a real boot.
        working-directory: app-host
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            php vendor/silverstripe/framework/cli-script.php dev/build flush=1
          else
            vendor/bin/sake db:build --flush
          fi

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of the module's declared php constraint, and the newest PHP tested above.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
