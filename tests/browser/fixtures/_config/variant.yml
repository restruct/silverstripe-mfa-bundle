---
Name: mfab-browser-fixtures
---
# BROWSER-TEST FIXTURE ONLY - copied to the scratch host's app/_config/browser-fixtures/ by the
# runner (fixture YAML in app/src would never be read). See MfaBVariantMiddleware.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        MfaBVariant: '%$Restruct\MfaBrowser\MfaBVariantMiddleware'
